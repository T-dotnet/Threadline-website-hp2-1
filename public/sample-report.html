document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en-AU\"><head>\n<meta charset=\"utf-8\">\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\">\n<meta content=\"Threadline Navigator assessment evidence report and clinician-only outcome worksheet template\" name=\"description\">\n<title>Threadline Navigator | Assessment Evidence Report and Clinician Outcome Worksheet<\u002Ftitle>\n\n<style>\n  :root{\n    --ink:#123f31;\n    --ink-2:#2d4942;\n    --ink-3:#62766f;\n    --green:#6f9e70;\n    --green-dark:#477b56;\n    --green-soft:#a9c7a0;\n    --mint:#edf3e9;\n    --pale:#f5f7f2;\n    --paper:#fffefb;\n    --line:#dfe7df;\n    --blue:#b9dfe8;\n    --blue-soft:#eef7f8;\n    --amber:#a86f45;\n    --amber-soft:#f8f0e9;\n    --rose:#9b5f5f;\n    --rose-soft:#f7eeee;\n    --grey:#8a9892;\n    --serif:'Cormorant Garamond','Iowan Old Style','Baskerville','Palatino Linotype',Georgia,serif;\n    --sans:'DM Sans',Inter,'Segoe UI',Arial,sans-serif;\n    --shadow:0 22px 60px rgba(18,63,49,.12);\n    --cover-art:url(\"ad4ec318-2618-4220-bff3-ec0df3afa7cc\");\n    \n    \n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0;background:#eef1ee;color:var(--ink-2);font-family:var(--sans);font-size:10pt;line-height:1.48;-webkit-font-smoothing:antialiased}\n  button,a{font:inherit}\n  .screen-toolbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 22px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}\n  .screen-toolbar strong{color:var(--ink)}\n  .screen-toolbar .tools{display:flex;align-items:center;gap:9px}\n  .screen-toolbar button,.screen-toolbar a{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:5px;padding:8px 13px;text-decoration:none;font-weight:650;cursor:pointer}\n  .screen-toolbar .secondary{background:#fff;color:var(--ink)}\n  .screen-note{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:99px;background:var(--mint);color:var(--green-dark);font-weight:650}\n  .document{padding:42px 16px 80px}\n  .page{position:relative;width:210mm;min-height:297mm;margin:0 auto 36px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;break-after:page}\n  .page-content{position:relative;z-index:2;padding:29mm 15mm 18mm}\n  .page-header{position:absolute;z-index:5;top:0;left:0;right:0;height:22mm;padding:8.5mm 14mm 0;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:start;color:var(--ink);font-size:7.5pt}\n  .page-header .brand{font-size:15pt}\n  .running-title{text-align:center;font-size:7pt;letter-spacing:.075em;font-weight:650;padding-top:3px;text-transform:uppercase}\n  .folio{text-align:right;font-size:7pt;font-weight:650;letter-spacing:.04em;padding-top:3px}\n  .folio span{display:inline-block;width:1px;height:11px;background:var(--ink);margin:0 9px -3px}\n  .page-footer{position:absolute;z-index:5;bottom:7.5mm;left:14mm;right:14mm;display:flex;justify-content:space-between;align-items:center;font-size:6.6pt;letter-spacing:.04em;color:#6b7f78}\n  .page-footer .confidential{text-transform:uppercase;letter-spacing:.1em;color:var(--green-dark)}\n  .brand{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:450;letter-spacing:-.025em}\n  .brand-mark{width:31px;height:31px}\n  .eyebrow{font-size:7.5pt;letter-spacing:.16em;font-weight:700;color:var(--green);text-transform:uppercase;margin-bottom:7mm}\n  .display-title{font-family:var(--serif);font-size:32pt;line-height:1.01;font-weight:500;letter-spacing:-.028em;color:var(--ink);max-width:165mm;margin:0}\n  .display-title.compact{font-size:28pt;max-width:150mm}\n  .display-title.hero{font-size:47pt;line-height:.94;max-width:155mm}\n  .title-rule{width:20mm;height:1.5px;background:var(--green);margin:7mm 0 8mm}\n  .section-deck{font-family:var(--serif);font-size:15.5pt;line-height:1.23;color:var(--ink);max-width:135mm;margin:0 0 8mm}\n nd\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 6<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">4. Evidence across settings<\u002Fdiv><h1 class=\"display-title compact simple-title\">Cross-source view<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<table class=\"data-table compact source-matrix\">\n<thead><tr><th>Domain<\u002Fth><th>Parent<\u002Fth><th>Teacher<\u002Fth><th>Child<\u002Fth><th>Records<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><strong>School and learning<\u002Fstrong><\u002Ftd><td>Needs repeated prompting to start and complete homework.<\u002Ftd><td>Begins late, loses track of multi-step tasks and submits incomplete work.<\u002Ftd><td>“I know what to do but I get stuck starting.”<\u002Ftd><td>Strong oral contribution with inconsistent written output.<\u002Ftd><\u002Ftr>\n<tr><td><strong>Home and routines<\u002Fstrong><\u002Ftd><td>Morning and bedtime routines require repeated reminders. Transitions can be difficult.<\u002Ftd><td>Not directly observed.<\u002Ftd><td>Reports morning tiredness and losing track of belongings.<\u002Ftd><td>No home-based record.<\u002Ftd><\u002Ftr>\n<tr><td><strong>Friendships<\u002Fstrong><\u002Ftd><td>Friendships have become harder this year, with occasional falling out.<\u002Ftd><td>Can interrupt peers and miss cues in group work, but has established friends.<\u002Ftd><td>Feels left out “sometimes” and says he is not trying to annoy people.<\u002Ftd><td>Paediatric report records parent concern about peer conflict.<\u002Ftd><\u002Ftr>\n<tr><td><strong>Organisation and independence<\u002Fstrong><\u002Ftd><td>Needs reminders for belongings, materials and routines.<\u002Ftd><td>Desk and materials are often disorganised. Benefits from a visual checklist.<\u002Ftd><td>Keeping track of things is one of the hardest areas.<\u002Ftd><td>Missing equipment and late assignments noted.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<div class=\"quiet-note\">These accounts remain source-attributed. Similarities and differences are shown for clinical exploration, not resolved by Threadline.<\u002Fdiv>\n<p class=\"quiet-footnote\">Blank cells indicate the domain was not assessed by that rater, not that no concern was present.<\u002Fp>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 7<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">5. Background and history<\u002Fdiv><h1 class=\"display-title compact simple-title\">Child, family and developmental history<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<div class=\"two-col history-layout\">\n<div>\n<h2>Developmental timeline<\u002Fh2>\n<div class=\"timeline simplified-timeline\">\n<div class=\"event\"><div class=\"when\">Birth · 2014<\u002Fdiv><div class=\"what\">Born at 39 weeks. Birth weight 3.4 kg. No pregnancy or birth complication reported.<\u002Fdiv><\u002Fdiv>\n<div class=\"event\"><div class=\"when\">Infancy and milestones<\u002Fdiv><div class=\"what\">Walking at 12 months, first words at approximately 18 months and toilet training by age three, as recalled by parent.<\u002Fdiv><\u002Fdiv>\n<div class=\"event\"><div class=\"when\">Year 1 · age 6<\u002Fdiv><div class=\"what\">School first raised concerns about staying seated, completing work and following group instructions.<\u002Fdiv><\u002Fdiv>\n<div class=\"event\"><div class=\"when\">Year 4 · age 9<\u002Fdiv><div class=\"what\">Homework became more difficult, with frustration and shutdown when tasks felt long or unclear.<\u002Fdiv><\u002Fdiv>\n<div class=\"event\"><div class=\"when\">Current · Year 6<\u002Fdiv><div class=\"what\">Continuing difficulty starting, completing and organising work, with stronger emotional reactions and emerging peer strain reported.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"plain-facts\">\n<h2>Family and current context<\u002Fh2>\n<dl>\n<dt>Household<\u002Fdt><dd>Lives with mother, father and older sister. Grandparents provide after-school support once each week.<\u002Fdd>\n<dt>Medical conditions and medication<\u002Fdt><dd>No diagnosed medical condition or current medication reported.<\u002Fdd>\n<dt>Family history<\u002Fdt><dd>Suspected but unassessed attention, organisation and time-management difficulties in the child's father.<\u002Fdd>\n<dt>Previous care<\u002Fdt><dd>Three occupational therapy sessions in 2024. Paediatric review in January 2026.<\u002Fdd>\n<dt>Head injury<\u002Fdt><dd>Medical review after a playground fall at age eight. No loss of consciousness or ongoing symptoms reported.<\u002Fdd>\n<dt>Strengths and interests<\u002Fdt><dd>Creative, kind to younger children, enjoys drawing, Lego and science, with a strong sense of humour.<\u002Fdd>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 8<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">6. Daily life and functioning<\u002Fdiv><h1 class=\"display-title compact simple-title\">Daily functioning<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<p class=\"intro-line\"><strong>Standardised functional outcomes:<\u002Fstrong> Parent Schoolwork T 68, Peer Interactions T 64 and Family Life T 63. Teacher Schoolwork T 72 and Peer Interactions T 64.<\u002Fp>\n<div class=\"function-list\">\n<section><div class=\"function-title\"><h2>School and learning<\u002Fh2><span>Greatest impact · Completing work<\u002Fspan><\u002Fdiv><p><strong>Areas selected:<\u002Fstrong> getting started, completing work, following instructions and staying organised.<\u002Fp><p>He may understand the task but complete only the first part unless an adult checks in repeatedly.<\u002Fp><\u002Fsection>\n<section><div class=\"function-title\"><h2>Home and daily life<\u002Fh2><span>Greatest impact · Homework<\u002Fspan><\u002Fdiv><p><strong>Areas selected:<\u002Fstrong> morning and bedtime, homework, transitions, strong emotions and sleep.<\u002Fp><p>Tasks often become prolonged, with repeated prompting and frustration when he loses track of the steps.<\u002Fp><\u002Fsection>\n<section><div class=\"function-title\"><h2>Friendships and social connections<\u002Fh2><span>Parent report<\u002Fspan><\u002Fdiv><p><strong>Areas selected:<\u002Fstrong> conflict or falling out, feeling left out and reading social situations.<\u002Fp><p>Several established friendships are reported, alongside more frequent misunderstandings this year.<\u002Fp><\u002Fsection>\n<section><div class=\"function-title\"><h2>Everyday tasks and independence<\u002Fh2><span>Parent report<\u002Fspan><\u002Fdiv><p><strong>Areas selected:<\u002Fstrong> keeping belongings organised, multi-step routines and completing tasks without reminders.<\u002Fp><p>School materials and personal belongings are often misplaced, and routines may stop after the first step.<\u002Fp><\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 9<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content child-reading-page\"><div class=\"eyebrow\">7. Child's perspective<\u002Fdiv><h1 class=\"display-title compact simple-title\">The child's own perspective<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<div class=\"topic-line\"><span>School or learning<\u002Fspan><span>Getting things done<\u002Fspan><span>Keeping track of things<\u002Fspan><span>Feeling worried or under pressure<\u002Fspan><span>Feeling tired or having trouble sleeping<\u002Fspan><\u002Fdiv>\n<div class=\"child-voice-main\">“Sometimes I know what the teacher said, but by the time I start I have forgotten part of it. Then everyone else is ahead and I feel like I am in trouble even when I am trying.”<cite>Child self-report · 24 May 2026<\u002Fcite><\u002Fdiv>\n<div class=\"voice-sections\">\n<section><h2>What helps<\u002Fh2><p>“When someone writes the steps down and I can cross them off. Also when I can take a short break without it being a big deal.”<\u002Fp><\u002Fsection>\n<section><h2>What grown-ups get wrong<\u002Fh2><p>“They think I am not listening or that I do not care. Sometimes I am listening but I cannot remember all of it.”<\u002Fp><\u002Fsection>\n<section><h2>Strengths and interests<\u002Fh2><p>Drawing characters, making Lego models, science facts and helping younger children.<\u002Fp><\u002Fsection>\n<section><h2>Support the child would like<\u002Fh2><p>“Less yelling when I forget, more steps written down, and help knowing how to start big assignments.”<\u002Fp><\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 10<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">8. Teacher and school evidence<\u002Fdiv><h1 class=\"display-title compact simple-title\">Teacher perspective and school support<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<div class=\"teacher-sections\">\n<section><h2>Strengths<\u002Fh2><p>Thomas is curious, verbally capable and highly engaged by science, design and practical problem-solving. He contributes original ideas and can explain concepts clearly when interested.<\u002Fp><\u002Fsection>\n<section><h2>Additional context<\u002Fh2><p>His work output can underestimate his understanding. He sometimes appears oppositional when a task is long or he is unsure how to begin, but often responds well when the first step is clarified privately.<\u002Fp><\u002Fsection>\n<section><h2>When he does his best work<\u002Fh2><p>Short, clearly sequenced tasks, visual examples, a quiet place, an early check-in and opportunities to demonstrate learning orally or practically.<\u002Fp><\u002Fsection>\n<\u002Fdiv>\n<div class=\"two-col school-bottom\">\n<div>\n<h2>Current school support<\u002Fh2>\n<ul class=\"simple-list\"><li>Visual timetable and written task steps<\u002Fli><li>Seat near the front for direct instruction<\u002Fli><li>Teacher check-in at task commencement<\u002Fli><li>Movement break between longer activities<\u002Fli><li>Informal extension of time for written tasks<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div class=\"school-record\"><div class=\"small-label\">Semester 1 school report · 2026<\u002Fdiv><p>Strong oral participation and scientific reasoning, inconsistent completion of written work, several missing tasks and improved engagement during practical activities.<\u002Fp><span>Source · Merrivale Primary School<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 11<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">9. Supporting records<\u002Fdiv><h1 class=\"display-title compact simple-title\">Supporting records and previous care<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<div class=\"record-list simplified-records\">\n<div class=\"record\"><div class=\"record-icon\">1<\u002Fdiv><div><h3>Paediatric report<\u002Fh3><div class=\"meta\">Dr Michael Chen · 12 January 2026 · 4 pages<\u002Fdiv><p>Records parent and teacher concern about inattention, impulsivity and emotional reactions. Recommends comprehensive ADHD assessment and collection of school evidence. No diagnosis recorded.<\u002Fp><\u002Fdiv><div class=\"link\">Appendix D1<\u002Fdiv><\u002Fdiv>\n<div class=\"record\"><div class=\"record-icon\">2<\u002Fdiv><div><h3>School semester report<\u002Fh3><div class=\"meta\">Merrivale Primary School · June 2026 · 6 pages<\u002Fdiv><p>Notes strong oral participation and science achievement, variable written output, incomplete assignments and benefit from visual supports. Attendance recorded as 94%.<\u002Fp><\u002Fdiv><div class=\"link\">Appendix D2<\u002Fdiv><\u002Fdiv>\n<div class=\"record\"><div class=\"record-icon\">3<\u002Fdiv><div><h3>Occupational therapy discharge note<\u002Fh3><div class=\"meta\">Riverside Allied Health · 3 December 2024 · 2 pages<\u002Fdiv><p>Three sessions addressed morning routines, handwriting fatigue and organisation of school materials. Visual checklists and a single storage location for school items were trialled.<\u002Fp><\u002Fdiv><div class=\"link\">Appendix D3<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<h2 class=\"table-heading\">Previous care, as reported<\u002Fh2>\n<table class=\"data-table compact simplified-table\"><thead><tr><th>Care<\u002Fth><th>Provider<\u002Fth><th>Timing<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Occupational therapy<\u002Ftd><td>Riverside Allied Health<\u002Ftd><td>Sep–Dec 2024<\u002Ftd><td>Completed<\u002Ftd><\u002Ftr><tr><td>Paediatric review<\u002Ftd><td>Dr Michael Chen<\u002Ftd><td>Jan 2026<\u002Ftd><td>Assessment referral<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page\"><header class=\"page-header\"><div class=\"brand\"><svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"20\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M5 20c8-9 14-9 22 0s14 9 16 7M5 28c8 9 14 9 22 0s14-9 16-7\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span>Threadline<\u002Fspan><\u002Fdiv><div class=\"running-title\">Assessment Evidence Report<\u002Fdiv><div class=\"folio\">NR-001 <span><\u002Fspan> PAGE 12<\u002Fdiv><\u002Fheader><main class=\"page-content simplified-content\"><div class=\"eyebrow\">10. Clinician review<\u002Fdiv><h1 class=\"display-title compact simple-title\">Follow-up priorities and evidence gaps<\u002Fh1><div class=\"title-rule\"><\u002Fdiv>\n<div class=\"review-grid\">\n<section><h2>Sleep<\u002Fh2><p>Difficulty settling, morning tiredness and thinking about schoolwork at night were reported. The parent Conners Sleep Problems Indicator was also raised.<\u002Fp><\u002Fsection>\n<section><h2>Worried or under pressure<\u002Fh2><p>The child selected this area, with falling behind at school as the main context. Parent reports anticipatory distress before homework and tests.<\u002Fp><\u002Fsection>\n<section><h2>Learning and written output<\u002Fh2><p>Understanding appears stronger than written output. No formal learning assessment was supplied and the vision screening remains outstanding.<\u002Fp><\u002Fsection>\n<section><h2>Cross-setting pattern<\u002Fh2><p>Attention, organisation and task-completion difficulties are described at home and school and are also selected by the child.<\u002Fp><\u002Fsection>\n<\u002Fdiv>\n<div class=\"two-col final-evidence\">\n<div>\n<h2>Outstanding or incomplete evidence<\u002Fh2>\n<ul class=\"simple-list\"><li>Vision screening result not supplied<\u002Fli><li>No formal learning assessment on file<\u002Fli><li>Extended family history not provided<\u002Fli><li>Confirm any current medication, supplements or sleep aids<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div>\n<h2>Source index<\u002Fh2>\n<table class=\"mini-source-table\"><tbody><tr><td>Parent history<\u002Ftd><td>18 May 2026<\u002Ftd><td>Complete<\u002Ftd><\u002Ftr><tr><td>Teacher evidence<\u002Ftd><td>22 May 2026<\u002Ftd><td>Complete<\u002Ftd><\u002Ftr><tr><td>Child evidence<\u002Ftd><td>24 May 2026<\u002Ftd><td>Complete<\u002Ftd><\u002Ftr><tr><td>Supporting records<\u002Ftd><td>2024–2026<\u002Ftd><td>3 documents<\u002Ftd><\u002Ftr><tr><td>Vision screening<\u002Ftd><td>–<\u002Ftd><td>Outstanding<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"end-part-note\"><strong>End of Part A.<\u002Fstrong> The following plum-coloured pages are blank clinician worksheets and are not generated or pre-populated by Threadline.<\u002Fdiv>\n<\u002Fmain><footer class=\"page-footer\"><span>© Threadline 2026<\u002Fspan><span class=\"confidential\">Confidential clinical information<\u002Fspan><span>Thomas H. · TL-2026-04871<\u002Fspan><\u002Ffooter><\u002Fsection><section class=\"page part-boundary\" id=\"clinician-section-divider\">\n<div class=\"boundary-inner\">\n<div class=\"boundary-brand\">\n<svg class=\"brand-mark\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" fill=\"none\" r=\"2
